# Per-tube, per-pixel spectra of both He3 banks, one slicer per bank.
title: 'He3: Spectrum View'
description: He3 per-tube, per-pixel spectra since start, one slicer per bank.
nrows: 2
ncols: 1
cells:
- geometry:
    row: 0
    col: 0
    row_span: 1
    col_span: 1
  layers:
  - data_sources:
      primary:
        workflow_id: tbl/he3_detector_view/1
        view_name: spectrum_view
        source_names:
        - he3_detector_bank0
    plot_name: slicer
    params:
      time_window:
        mode: since_start
      plot_scale:
        x_scale: linear
        y_scale: linear
        color_scale: log
- geometry:
    row: 1
    col: 0
    row_span: 1
    col_span: 1
  layers:
  - data_sources:
      primary:
        workflow_id: tbl/he3_detector_view/1
        view_name: spectrum_view
        source_names:
        - he3_detector_bank1
    plot_name: slicer
    params:
      time_window:
        mode: since_start
      plot_scale:
        x_scale: linear
        y_scale: linear
        color_scale: log
