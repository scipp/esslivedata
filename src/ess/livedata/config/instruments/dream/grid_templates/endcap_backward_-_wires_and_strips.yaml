    plot_name: vlines
    params:
      geometry:
        positions: 9.5,17.5,23.5,37.5,45.5,51.5,65.5,73.5,79.5,93.5,101.5,107.5,121.5,129.5,135.5,149.5,157.5,163.5,177.5,185.5,191.5,205.5,213.5,219.5,233.5,241.5,247.5,261.5,269.5,275.5,289.5,297.5,303.5
