[tox]
envlist = py312
isolated_build = true

[testenv]
deps = -r requirements/test.txt
setenv =
  JUPYTER_PLATFORM_DIRS = 1
# Override pyproject.toml addopts: include slow tests, still skip browser tests
commands = pytest -m "not integration and not browser" -n auto {posargs}

[testenv:integration]
description = Run integration tests (requires Kafka to be running)
deps = -r requirements/test.txt
setenv =
  JUPYTER_PLATFORM_DIRS = 1
# Integration tests drive real services against a single shared Kafka broker, so
# they must not run in parallel: -n0 overrides the -n auto in addopts.
commands = pytest -m integration -n0 {posargs} tests/integration/

[testenv:browser]
description = Run browser-driven (Playwright) UI tests against the fake backend
deps =
  -r requirements/test.txt
  playwright
setenv =
  JUPYTER_PLATFORM_DIRS = 1
# System libraries for chromium are not installed here; on CI a workflow step
# runs `playwright install-deps chromium` (needs sudo) before invoking tox.
commands_pre = playwright install chromium
commands = pytest -m browser -n 2 {posargs} tests/dashboard/

[testenv:browser-latest]
description = Run the browser tests against the newest Panel/HoloViews/Bokeh
# Production installs from pyproject.toml, not the lock files, so a new Panel,
# HoloViews or Bokeh release reaches the dashboard image before the locks move.
# This env runs the browser tests against the newest releases, pre-releases
# included, ignoring the caps in pyproject.toml on purpose: pip reports the
# conflict and installs anyway. Select other versions with pip requirement
# specifiers in PANEL_SPEC, HOLOVIEWS_SPEC or BOKEH_SPEC, e.g.
#   PANEL_SPEC='panel==1.9.4' BOKEH_SPEC='bokeh>=3.10' tox -e browser-latest
# A combination that contradicts Panel's own Bokeh bound fails to resolve.
deps = {[testenv:browser]deps}
setenv = {[testenv:browser]setenv}
commands_pre =
  python -m pip install --pre --upgrade \
    {env:PANEL_SPEC:panel} {env:HOLOVIEWS_SPEC:holoviews} {env:BOKEH_SPEC:bokeh}
  python -m pip list --format=freeze
  {[testenv:browser]commands_pre}
commands = {[testenv:browser]commands}

[testenv:nightly]
deps = -r requirements/nightly.txt
setenv =
  PIP_INDEX_URL = https://pypi.anaconda.org/scipp-nightly-wheels/simple
  PIP_EXTRA_INDEX_URL = https://pypi.org/simple
# Override pyproject.toml addopts: include slow tests, still skip browser tests
commands = pytest -m "not integration and not browser" -n auto {posargs}

[testenv:unpinned]
description = Test with unpinned dependencies, as a user would install now.
deps =
  -r requirements/basetest.txt
  esslivedata
# Override pyproject.toml addopts: include slow tests, still skip browser tests
commands = pytest -m "not integration and not browser" -n auto {posargs}

[testenv:docs]
description = invoke sphinx-build to build the HTML docs
deps = -r requirements/docs.txt
allowlist_externals=find
commands = python -m sphinx -W -j2 -v -b html -d {toxworkdir}/docs_doctrees docs html
           python -m sphinx -W -j2 -v -b doctest -d {toxworkdir}/docs_doctrees docs html
           find html -type f -name "*.ipynb" -not -path "html/_sources/*" -delete

[testenv:releasedocs]
description = invoke sphinx-build to build the HTML docs from a released version
skip_install = true
deps =
  esslivedata=={posargs}
  {[testenv:docs]deps}
allowlist_externals={[testenv:docs]allowlist_externals}
commands = {[testenv:docs]commands}

[testenv:linkcheck]
description = Run Sphinx linkcheck
deps = -r requirements/docs.txt
commands = python -m sphinx -j2 -v -b linkcheck -d {toxworkdir}/docs_doctrees docs html

[testenv:static]
description = Code formatting and static analysis
skip_install = true
deps = -r requirements/static.txt
allowlist_externals = sh
# The first run of pre-commit may reformat files. If this happens, it returns 1 but this
# should not fail the job. So just run again if it fails. A second failure means that
# either the different formatters can't agree on a format or that static analysis failed.
commands = sh -c 'pre-commit run -a || (echo "" && pre-commit run -a)'

[testenv:mypy]
description = Type checking (mypy)
deps = -r requirements/mypy.txt
commands = python -m mypy .

[testenv:deps]
description = Update dependencies by running pip-compile-multi
deps =
  pip-compile-multi
  tomli
  # Avoid https://github.com/jazzband/pip-tools/issues/2131
  pip==24.2
skip_install = true
changedir = requirements
commands = python ./make_base.py
           pip-compile-multi -d . --backtracking --annotate-index
