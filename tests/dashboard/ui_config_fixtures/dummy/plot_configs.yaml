plot_grids:
  grids:
  - title: Detectors
    nrows: 3
    ncols: 2
    cells:
    - geometry:
        row: 0
        col: 0
        row_span: 2
        col_span: 1
      layers:
      - data_sources:
          primary:
            workflow_id: dummy/area_panel_xy/1
            source_names:
            - area_panel
            view_name: image
        plot_name: image
        params:
          layout:
            combine_mode: layout
            layout_columns: 2
          plot_aspect:
            aspect_type: Square
            ratio: 1.0
            stretch_mode: Fill width
          plot_scale:
            x_scale: linear
            y_scale: linear
            color_scale: log
          ticks:
            custom_xticks: false
            xticks: 5
            custom_yticks: false
            yticks: 5
          time_window:
            mode: window
            window_duration_seconds: 0.0
            aggregation: auto
          rate:
            normalize_to_rate: false
    # Image with the ROI overlay stack the UI builds on top of it (readback
    # before request, as OVERLAY_PATTERNS orders them). Drawing a rectangle
    # here exercises the request/readback loopback end to end.
    - geometry:
        row: 0
        col: 1
        row_span: 2
        col_span: 1
      layers:
      - data_sources:
          primary:
            workflow_id: dummy/panel_0_xy/1
            source_names:
            - panel_0
            view_name: image
        plot_name: image
        params:
          layout:
            # Overlay mode: a layout-mode plot may not share its cell.
            combine_mode: overlay
            layout_columns: 2
          plot_aspect:
            aspect_type: Square
            ratio: 1.0
            stretch_mode: Fill width
          plot_scale:
            x_scale: linear
            y_scale: linear
            color_scale: log
          ticks:
            custom_xticks: false
            xticks: 5
            custom_yticks: false
            yticks: 5
          time_window:
            mode: window
            window_duration_seconds: 0.0
            aggregation: auto
          rate:
            normalize_to_rate: false
      - data_sources:
          primary:
            workflow_id: dummy/panel_0_xy/1
            source_names:
            - panel_0
            view_name: roi_rectangle
        plot_name: rectangles_readback
        params: {}
      - data_sources:
          primary:
            workflow_id: dummy/panel_0_xy/1
            source_names:
            - panel_0
            view_name: roi_rectangle
        plot_name: rectangles_request
        params: {}
    # Two layers in one cell, so the titlebar gear is a layer-picker menu rather
    # than a direct button. Omitted params take their model defaults.
    - geometry:
        row: 2
        col: 0
        row_span: 1
        col_span: 2
      layers:
      - data_sources:
          primary:
            workflow_id: dummy/monitor_histogram/1
            source_names:
            - monitor1
            view_name: histogram
        plot_name: lines
        params: {}
      - data_sources:
          primary:
            workflow_id: dummy/monitor_histogram/1
            source_names:
            - monitor2
            view_name: histogram
        plot_name: lines
        params: {}
  # A second grid, so the fixture covers multi-grid rendering and the tab
  # ordering controls. Cells here cover the plotter families the detector grid
  # does not reach; a grid's rows share its height, so they get their own tab
  # rather than squeezing the detector images.
  - title: Diagnostics
    nrows: 2
    ncols: 2
    cells:
    - geometry:
        row: 0
        col: 0
        row_span: 1
        col_span: 1
      layers:
      - data_sources:
          primary:
            workflow_id: dummy/timeseries_data/1
            source_names:
            - motion1
            - motion2
            view_name: delta
        plot_name: timeseries
        params: {}
    - geometry:
        row: 0
        col: 1
        row_span: 1
        col_span: 1
      layers:
      - data_sources:
          primary:
            workflow_id: dummy/total_counts/1
            source_names:
            - panel_0
            view_name: total_counts
        plot_name: table
        params: {}
    - geometry:
        row: 1
        col: 0
        row_span: 1
        col_span: 2
      layers:
      - data_sources:
          primary:
            workflow_id: dummy/panel_0_layers/1
            source_names:
            - panel_0
            view_name: image
        plot_name: slicer
        params: {}
