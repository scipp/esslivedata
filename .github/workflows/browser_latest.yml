name: Browser tests on latest Panel/HoloViews/Bokeh

# Runs `tox -e browser-latest` (see tox.ini) on main, so that a Panel, HoloViews
# or Bokeh release that breaks the dashboard shows up before the next image is
# built (#1419). A separate workflow so that a known upstream breakage does not
# mask other nightly failures.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      panel:
        description: 'Panel requirement specifier'
        default: 'panel'
        type: string
      holoviews:
        description: 'HoloViews requirement specifier'
        default: 'holoviews'
        type: string
      bokeh:
        description: 'Bokeh requirement specifier'
        default: 'bokeh'
        type: string
  pull_request:
    paths:
      - '.github/workflows/browser_latest.yml'

jobs:
  browser-latest:
    name: Browser tests (latest Panel/HoloViews/Bokeh)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.github/workflows/python-version-ci'
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/ci.txt
      - name: Install chromium system libraries
        # As in ci.yml: the runner image already has chromium's shared
        # libraries, so a failing apt mirror only costs fonts.
        run: |
          python -m pip install playwright
          timeout -k 30 180 playwright install-deps chromium || echo \
            "::warning title=install-deps::apt failed or timed out; continuing without extra fonts."
      - name: Run browser tests
        env:
          # Inputs are empty on schedule and pull_request. An empty variable
          # would drop the package from tox's install command, so fall back here.
          PANEL_SPEC: ${{ inputs.panel || 'panel' }}
          HOLOVIEWS_SPEC: ${{ inputs.holoviews || 'holoviews' }}
          BOKEH_SPEC: ${{ inputs.bokeh || 'bokeh' }}
        run: tox -e browser-latest
      - name: Report resolved versions
        if: always()
        run: |
          {
            echo '### Resolved versions'
            echo '```'
            .tox/browser-latest/bin/python -m pip list --format=freeze \
              | grep -iE '^(bokeh|panel|holoviews|param|pyviz.comms)=='
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
