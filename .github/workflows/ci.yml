name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:

jobs:
  formatting:
    name: Formatting and static analysis
    runs-on: 'ubuntu-24.04'
    outputs:
      min_python: ${{ steps.vars.outputs.min_python }}
      min_tox_env: ${{ steps.vars.outputs.min_tox_env }}
    steps:
      - uses: actions/checkout@v4
      - name: Get Python version for other CI jobs
        id: vars
        run: |
          echo "min_python=$(< .github/workflows/python-version-ci)" >> "$GITHUB_OUTPUT"
          echo "min_tox_env=py$(sed 's/\.//g' < .github/workflows/python-version-ci)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.github/workflows/python-version-ci'
      # pre-commit 4.6.1 installs `language: node` hooks with
      # `npm install --allow-git=root`, a flag that only exists in npm 12. The
      # runner image ships npm 10, where the install leaves no executable
      # behind and the hook fails with "Executable not found". See #1162.
      - name: Update npm for pre-commit's node hooks
        run: npm install -g npm@^12
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: always()
        with:
          msg: Apply automatic formatting

  tests:
    name: Tests
    needs: formatting
    strategy:
      matrix:
        os: ['ubuntu-24.04']
        python:
          - version: '${{needs.formatting.outputs.min_python}}'
            tox-env: '${{needs.formatting.outputs.min_tox_env}}'
    uses: ./.github/workflows/test.yml
    with:
      os-variant: ${{ matrix.os }}
      python-version: ${{ matrix.python.version }}
      tox-env: ${{ matrix.python.tox-env }}
    secrets: inherit

  integration:
    # Real-Kafka integration tests: fake data sources feeding the real
    # service stack (monitor_data/detector_data/data_reduction) plus the
    # dashboard backend, against a single-node KRaft broker. Runs in
    # parallel with the unit-test job.
    name: Integration tests (Kafka)
    needs: formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_MESSAGE_MAX_BYTES: 104857600
          KAFKA_REPLICA_FETCH_MAX_BYTES: 104857600
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ needs.formatting.outputs.min_python }}'
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/ci.txt
      - name: Run integration tests
        shell: bash
        run: |
          tox -e integration 2>&1 | tee integration-output.txt
          exit "${PIPESTATUS[0]}"
      - name: Surface failure output as annotations
        # Log download can be firewalled; annotations are readable via the
        # checks API. Emit the pytest failure summary in newline-escaped
        # chunks (annotation count and size are limited).
        if: failure()
        shell: bash
        run: |
          set +e
          sed -e 's/\x1b\[[0-9;]*m//g' integration-output.txt \
            | grep -v 'Consumed 0 messages' > clean.txt
          awk '/=== (FAILURES|ERRORS) ===/{found=1} found && n<150 {print; n++}' clean.txt > summary.txt
          grep 'DIAG' clean.txt >> summary.txt
          sed -n '/short test summary info/,$p' clean.txt >> summary.txt
          if [ ! -s summary.txt ]; then
            tail -n 100 clean.txt > summary.txt
          fi
          split -l 20 summary.txt chunk_
          n=0
          for f in chunk_*; do
            [ -e "$f" ] || continue
            n=$((n + 1))
            if [ "$n" -gt 8 ]; then break; fi
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=integration-tests part ${n}::${msg}"
          done
          true

  browser:
    # Playwright UI tests: a real chromium driving the dashboard served by the
    # in-process fake backend (no Kafka), covering multi-session sync and grid
    # management flows. Runs in parallel with the unit-test job.
    name: Browser UI tests (Playwright)
    needs: formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ needs.formatting.outputs.min_python }}'
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/ci.txt
      - name: Install chromium system libraries
        # The chromium binary itself is installed by the tox env (matching its
        # playwright version); only the apt-level libraries need sudo here. On
        # ubuntu-24.04 that resolves to fonts alone -- the runner image already
        # carries chromium's shared libraries -- so a broken apt mirror must not
        # cost us the job. Bound the attempt and continue without the fonts;
        # the browser tests measure layout geometry, not glyphs.
        run: |
          python -m pip install playwright
          timeout -k 30 180 playwright install-deps chromium || echo \
            "::warning title=install-deps::apt failed or timed out; continuing without extra fonts."
      - name: Run browser tests
        shell: bash
        run: |
          tox -e browser 2>&1 | tee browser-output.txt
          exit "${PIPESTATUS[0]}"
      - name: Surface failure output as annotations
        # Log download can be firewalled; annotations are readable via the
        # checks API. Emit the pytest failure summary in newline-escaped
        # chunks (annotation count and size are limited).
        if: failure()
        shell: bash
        run: |
          set +e
          sed -e 's/\x1b\[[0-9;]*m//g' browser-output.txt > clean.txt
          awk '/=== (FAILURES|ERRORS) ===/{found=1} found && n<150 {print; n++}' clean.txt > summary.txt
          sed -n '/short test summary info/,$p' clean.txt >> summary.txt
          if [ ! -s summary.txt ]; then
            tail -n 100 clean.txt > summary.txt
          fi
          split -l 20 summary.txt chunk_
          n=0
          for f in chunk_*; do
            [ -e "$f" ] || continue
            n=$((n + 1))
            if [ "$n" -gt 8 ]; then break; fi
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=browser-tests part ${n}::${msg}"
          done
          true

  instrument-check:
    # Verify that an instrument deployment can construct its backend services
    # using only the dependencies declared in its extras. Catches imports that
    # accidentally depend on packages installed only via ``[test]`` or another
    # instrument's extras, which would break in production.
    name: Backend deps (${{ matrix.instrument }})
    needs: tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        instrument: [beer, bifrost, dream, dummy, estia, loki, magic, nmx, odin, tbl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.github/workflows/python-version-ci'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[${{ matrix.instrument }}]"
      - name: Smoke-check backend services
        run: |
          for svc in monitor_data detector_data data_reduction timeseries; do
            echo "::group::$svc"
            python -m ess.livedata.services.$svc \
              --instrument ${{ matrix.instrument }} --check
            echo "::endgroup::"
          done

  dashboard-check:
    # Verify the dashboard can be constructed for every instrument using only
    # the [dashboard] extra (which has no instrument-specific dependencies).
    # If this fails for some instrument, either the dashboard has acquired a
    # hidden instrument dependency or [dashboard] is missing something.
    name: Dashboard deps
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.github/workflows/python-version-ci'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dashboard]"
      - name: Smoke-check dashboard for each instrument
        run: |
          for inst in $(python -c 'from ess.livedata.config.instruments import available_instruments; print(" ".join(available_instruments()))'); do
            echo "::group::$inst"
            python -m ess.livedata.dashboard.reduction \
              --instrument "$inst" --transport none \
              --no-fetch-announcements --check
            echo "::endgroup::"
          done

  container-check:
    # Unlike the host jobs, this exercises the actual Dockerfile targets. The
    # backend checks that all instrument extras coexist in the published image;
    # the dashboard checks that its intentionally smaller image remains enough.
    name: Container contract (${{ matrix.target }})
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: esslivedata-${{ matrix.target }}:test
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0
          cache-from: type=gha,scope=contract-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=contract-${{ matrix.target }}
      - name: Smoke-check backend image
        if: matrix.target == 'backend'
        run: |
          instruments=$(docker run --rm esslivedata-backend:test \
            python -c 'from ess.livedata.config.instruments import available_instruments; print(" ".join(available_instruments()))')
          for inst in $instruments; do
            for svc in monitor_data detector_data data_reduction timeseries; do
              echo "::group::$inst/$svc"
              docker run --rm \
                -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092 \
                -e KAFKA_SECURITY_PROTOCOL=SASL_PLAINTEXT \
                -e KAFKA_SASL_MECHANISM=SCRAM-SHA-256 \
                -e KAFKA_SASL_USERNAME=test \
                -e KAFKA_SASL_PASSWORD=test \
                esslivedata-backend:test \
                python -m ess.livedata.services.$svc \
                  --instrument "$inst" --check
              echo "::endgroup::"
            done
          done
      - name: Check Kafka TLS configuration in backend image
        if: matrix.target == 'backend'
        run: |
          docker run --rm \
            -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092 \
            -e KAFKA_SECURITY_PROTOCOL=SASL_SSL \
            -e KAFKA_SASL_MECHANISM=SCRAM-SHA-256 \
            -e KAFKA_SASL_USERNAME=test \
            -e KAFKA_SASL_PASSWORD=test \
            -e KAFKA_SSL_CA_LOCATION=/etc/ssl/certs/ca-certificates.crt \
            esslivedata-backend:test \
            python -c "from ess.livedata.config.config_loader import load_config; config = load_config(namespace='kafka'); assert config['ssl.ca.location'] == '/etc/ssl/certs/ca-certificates.crt'"
      - name: Check writable reference-data cache in backend image
        if: matrix.target == 'backend'
        run: |
          docker run --rm esslivedata-backend:test \
            python -c "import os; from pathlib import Path; path = Path(os.environ['SCIPP_DATA_DIR']); assert path == Path('/app/data/cache'); probe = path / '.write-test'; probe.write_text('ok'); probe.unlink()"
      - name: Smoke-check dashboard image
        if: matrix.target == 'dashboard'
        run: |
          instruments=$(docker run --rm esslivedata-dashboard:test \
            python -c 'from ess.livedata.config.instruments import available_instruments; print(" ".join(available_instruments()))')
          for inst in $instruments; do
            echo "::group::$inst"
            docker run --rm \
              esslivedata-dashboard:test \
              python -m ess.livedata.dashboard.reduction \
              --instrument "$inst" --transport none \
              --no-fetch-announcements --check
            echo "::endgroup::"
          done

  docs:
    needs: tests
    uses: ./.github/workflows/docs.yml
    with:
      publish: false
      linkcheck: ${{ github.ref == 'refs/heads/main' }}
      branch: ${{ github.head_ref == '' && github.ref_name || github.head_ref }}
    secrets: inherit
